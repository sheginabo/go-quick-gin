  mongodb:
    image: mongo:latest
    container_name: mongodb_container
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: example
      MONGO_INITDB_DATABASE: chatdb
    volumes:
      - mongo_data:/data/db
      - ./build/local/docker/mongo/init-mongo.js:/docker-entrypoint-initdb.d/init-mongo.js

volumes:
  mongo_data: